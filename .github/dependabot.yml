version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      ml-stack:
        patterns: ["torch*", "transformers*"]
        update-types: ["minor", "patch"]
      dev-tools:
        patterns: ["pytest*", "ruff*", "mypy*"]
    ignore:
      - dependency-name: "torch*"
        update-types: ["version-update:semver-major"]
      # transformers: forward-replacement adapter is verbatim-coupled to ~=4.57.
      # Even minor bumps can break Gate 0; manual upgrades only after re-validation.
      # See PR #39 (closed) for the precedent.
      - dependency-name: "transformers"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
