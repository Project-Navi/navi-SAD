name: Auto uv lock for dependabot

# Dependabot bumps pyproject.toml without regenerating uv.lock,
# which makes `uv sync --locked` fail in CI on every Python PR.
# This workflow regenerates the lockfile on dependabot PRs and
# pushes it back to the PR branch so CI passes without manual fix.
# See: project_apr27_pr_remediation_session memory note.

on:
  pull_request:
    paths:
      - pyproject.toml

permissions:
  contents: write
  pull-requests: read

jobs:
  regenerate-lockfile:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.head_ref }}

      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.10"

      - name: Regenerate uv.lock
        run: uv lock

      - name: Commit and push if changed
        run: |
          if ! git diff --quiet uv.lock; then
            git config user.name "dependabot[bot]"
            git config user.email "49699333+dependabot[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "chore(deps): regenerate uv.lock"
            git push
          fi
