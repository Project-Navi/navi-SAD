name: Auto uv lock for dependabot

# Dependabot bumps pyproject.toml without regenerating uv.lock,
# which makes `uv sync --locked` fail in CI on every Python PR.
# This workflow regenerates the lockfile on dependabot PRs and
# pushes it back to the PR branch so CI passes without manual fix.
# See: project_apr27_pr_remediation_session memory note.

on:
  pull_request:
    paths:
      - pyproject.toml

permissions:
  contents: write
  pull-requests: read

jobs:
  regenerate-lockfile:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref }}

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"

      - name: Regenerate uv.lock
        run: uv lock

      - name: Commit and push if changed
        run: |
          if ! git diff --quiet uv.lock; then
            git config user.name "dependabot[bot]"
            git config user.email "49699333+dependabot[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "chore(deps): regenerate uv.lock"
            git push origin HEAD:${{ github.head_ref }}
          fi
